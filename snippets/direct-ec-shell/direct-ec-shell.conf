# The `ec` shell over USB serial, for characterising a board and checking a
# build. Not for the image a keyboard runs day to day.

CONFIG_SHELL=y
CONFIG_ZMK_KSCAN_DIRECT_EC_SHELL=y
CONFIG_ZMK_KSCAN_DIRECT_EC_BRINGUP=y

# What the shell needs to run over the CDC ACM port in the overlay. Logging
# and the console are left as the board has them: on a 32 kB part there is no
# room for both.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL=y
